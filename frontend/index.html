<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>J.A.R.V.I.S.</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="grid-overlay"></div>

  <header class="top-bar">
    <div class="brand">
      <div class="reactor" id="reactor"></div>
      <div class="titles">
        <h1>J.A.R.V.I.S.</h1>
        <span class="subtitle">Just A Rather Very Intelligent System</span>
      </div>
    </div>
    <div class="status-cluster">
      <span class="status-pill" id="status-brain">Kern …</span>
      <span class="status-pill" id="status-home">Smart Home …</span>
    </div>
  </header>

  <main class="chat-wrap">
    <div id="messages" class="messages">
      <div class="msg jarvis">
        <div class="bubble">
          Systeme hochgefahren. Guten Tag — wie kann ich Sie unterstützen?
        </div>
      </div>
    </div>

    <div class="suggestions" id="suggestions">
      <button class="chip">Was kannst du?</button>
      <button class="chip">Schalte das Licht im Wohnzimmer ein</button>
      <button class="chip">Stelle das Wohnzimmer auf 22 Grad</button>
      <button class="chip">Status</button>
      <button class="chip">Wie spät ist es?</button>
      <button class="chip">Erzähl mir einen Spruch</button>
    </div>

    <div class="composer">
      <button id="mic-btn" class="mic-btn" title="Sprechen (Spracheingabe)">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z" fill="currentColor"/></svg>
      </button>
      <textarea id="input" rows="1" placeholder="Nachricht an Jarvis … (Enter zum Senden)"></textarea>
      <button id="send-btn" class="send-btn" title="Senden">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 20.5 21 12 3 3.5 3 10l13 2-13 2z" fill="currentColor"/></svg>
      </button>
      <button id="voice-toggle" class="voice-toggle on" title="Sprachausgabe an/aus">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 10v4h4l5 5V5L7 10H3Zm13.5 2a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4Z" fill="currentColor"/></svg>
      </button>
    </div>
    <div class="hint" id="listening-hint"></div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
